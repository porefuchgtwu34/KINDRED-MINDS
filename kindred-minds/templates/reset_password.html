{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block public_content %}
<section class="auth-wrap">
  <form class="auth-card" method="POST">
    <span class="eyebrow">Almost done</span>
    <h1>Choose a new password</h1>
    <label>New password
      <input type="password" name="password" minlength="6" required autofocus>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm" minlength="6" required>
    </label>
    <button type="submit" class="btn btn-rose btn-lg btn-block">Update password</button>
  </form>
</section>
{% endblock %}
