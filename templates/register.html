{% extends "base.html" %}
{% block title %}Join{% endblock %}
{% block public_content %}
<section class="auth-wrap">
  <form class="auth-card" method="POST">
    <span class="eyebrow">Start here</span>
    <h1>Create your username</h1>
    <p class="auth-hint">No real names required. Just a handle the community will know you by.</p>
    <label>Username
      <input type="text" name="username" value="{{ username }}" required pattern="[A-Za-z0-9_]{3,20}" title="3–20 letters, numbers or underscores">
    </label>
    <label>Email
      <input type="email" name="email" value="{{ email }}" required>
    </label>
    <label>Password <span class="label-note">at least 6 characters</span>
      <input type="password" name="password" required minlength="6">
    </label>
    <label>Confirm password
      <input type="password" name="confirm" required minlength="6">
    </label>
    <button type="submit" class="btn btn-rose btn-lg btn-block">Join Kindred Minds</button>
    <div class="auth-links">
      <a href="{{ url_for('login') }}">Already have an account?</a>
    </div>
  </form>
</section>
{% endblock %}
