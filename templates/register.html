{% extends "base.html" %}
{% block title %}Register — Kindred Minds{% endblock %}
{% block public_content %}
<div class="card" style="max-width:420px;margin:2rem auto;">
  <h2>Create account</h2>
  {% include "_flash.html" %}
  <form method="post">
    <label>Username</label>
    <input name="username" value="{{ username }}" required pattern="[A-Za-z0-9_]{3,20}" title="3-20 letters, numbers, underscores">
    <label>Email</label>
    <input type="email" name="email" value="{{ email }}" required>
    <label>Password</label>
    <input type="password" name="password" required minlength="6">
    <label>Confirm password</label>
    <input type="password" name="confirm" required minlength="6">
    <button class="btn" type="submit">Join</button>
  </form>
  <p style="margin-top:1rem;font-size:0.9rem;color:var(--muted)">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
