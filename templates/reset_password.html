{% extends "base.html" %}
{% block title %}New password{% endblock %}
{% block public_content %}
<section class="auth-wrap">
  <form class="auth-card" method="POST">
    <span class="eyebrow">Almost there</span>
    <h1>Choose a new password</h1>
    <label>New password <span class="label-note">at least 6 characters</span>
      <input type="password" name="password" required minlength="6" autofocus>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" required minlength="6">
    </label>
    <button type="submit" class="btn btn-rose btn-lg btn-block">Update password</button>
  </form>
</section>
{% endblock %}
